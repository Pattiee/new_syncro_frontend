name: Vercel Production Deployment Matrix 🚀

on:
  push:
    branches:
      - main # Triggers compilation pipelines whenever you push changes to your main branch
  pull_request:
    branches:
      - main

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Clone code layers from the GitHub repository into the virtual execution machine
      - name: Checkout Source Code Repository 📂
        uses: actions/checkout@v4

      # 2. Mount and activate pnpm cleanly using your explicit project requirements
      - name: Setup pnpm Package Manager 📦
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.4 # Forces structural symmetry matching your package.json engine block

      # 3. Initialize Node 22 (LTS) environment pools
      - name: Initialize Node.js Execution Context (v22 LTS) 🛠️
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm' # Automatically caches global package downloads to speed up future runs

      # 4. Install project modules strictly mirroring your configuration structures
      - name: Install System Dependencies 📥
        run: pnpm install --frozen-lockfile

      # 5. Execute our strict static compilation type check
      - name: Verify TypeScript Stability Pipeline 🔍
        run: pnpm type-check

      # 6. Install the official Vercel Core CLI system binary
      - name: Pull Vercel Core Interface Engine 🤖
        run: pnpm add -g vercel

      # 7. Pull deployment token configuration metadata from your remote cloud dashboard account
      - name: Pull Vercel Environment Configuration 📡
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # 8. Compile optimized assets securely utilizando environment production structures
      - name: Compile Optimized Webpack Core Bundles 🏗️
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # 9. Release the final bundle directly onto your live production platform url map
      - name: Release Production Artifacts to Vercel Cloud 🚀
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}