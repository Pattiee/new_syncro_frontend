server {
  listen 3000;

  root /usr/share/nginx/html;
  index index.html;

  # Tells Nginx to look for pre-compressed .gz files first
  gzip_static on; 

  # Tells Nginx to look for pre-compressed .br files first (Requires Nginx Brotli module installed)
  brotli_static on;

  # Recommended Security Additions
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # SPA Routing Rule
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to your backend microservices gateway
  location /api/ {
    # Aligned trailing slash structures to ensure clean URL re-writes on upstream targets
    proxy_pass http://gateway:8080/;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Enables WebSocket connection upgrades for real-time traffic
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Timeouts for reliable connection retention
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
  }
}