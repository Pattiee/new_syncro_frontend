server {
  listen 3000;

  root /usr/share/nginx/html;
  index index.html;

# Tells Nginx to look for .gz files first
  gzip_static on; 

  # Tells Nginx to look for .br files first (Requires Nginx Brotli module installed)
  brotli_static on;

  location / {
    try_files $uri /index.html;
  }

  # Proxy API requests to your backend gateway
  location /api/ {
    proxy_pass http://gateway:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}