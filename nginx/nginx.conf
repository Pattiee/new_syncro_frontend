server {
  listen 3000;

  root /usr/share/nginx/html;
  index index.html;

# Tells Nginx to look for .gz files first
  gzip_static on; 

  # Tells Nginx to look for .br files first (Requires Nginx Brotli module installed)
  brotli_static on;

# Recommended Security Additions
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;

  location / {
    try_files $uri /index.html;
  }

  # Proxy API requests to your backend gateway
  location /api/ {
    proxy_pass http://gateway:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

# Enables WebSocket connection upgrades for real-time traffic
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}